server:
  port: 8081

domain:
  name: localhost

frontend:
  uri: http://localhost:3000

spring:
  cloud:
    aws:
      s3:
        endpoint: http://localhost:9000
        path-style-access-enabled: true
      region:
        static: us-east-1
      credentials: 
        access-key: ${MINIO_ROOT_USER}
        secret-key: ${MINIO_ROOT_PASSWORD}